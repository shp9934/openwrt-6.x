name: Build LiBwrt 6.x 亚瑟AX1800 (NSS+Passwall)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # ✅ 核心修复：仅安装 OpenWrt 官方必需依赖（零报错）
      - name: 安装编译依赖（极简无错版）
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      # ✅ 拉取 Passwall 插件
      - name: 添加 Passwall 软件源
        run: |
          git clone https://github.com/xiaorouji/openwrt-passwall.git package/passwall
          git clone https://github.com/xiaorouji/openwrt-passwall-packages.git package/passwall-packages

      # ✅ 更新软件源
      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ✅ 固件配置：亚瑟AX1800 + NSS + Passwall
      - name: 生成编译配置
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdc_ax1800-pro=y
          CONFIG_NSS_DRIVER_ENABLE=y
          CONFIG_PACKAGE_luci-app-nss-ecm=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          EOF
          make defconfig

      # ✅ 下载依赖包
      - name: 下载软件包
        run: make download -j$(nproc)

      # ✅ 编译固件（失败自动单线程调试）
      - name: 开始编译
        run: make -j$(nproc) || make -j1 V=s

      # ✅ 上传固件
      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-ax1800-final
          path: bin/targets/qualcommax/ipq60xx/*.bin
